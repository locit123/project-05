    <body style="height: 50000px">
        <header class="header">
            <div class="container">
                <!-- Header Top -->
                <div class="header-top">
                    <!-- Logo -->
                    <div class="header-top__Logo">
                        <img src="./assets/icon/logo.svg" alt="MODULARS" />
                        <span class="header-top__text">MODULARS</span>
                    </div>
                    <!-- Nav -->
                    <nav class="header-top__nav">
                        <ul class="header-top__list">
                            <li>
                                <a class="header-top__link active" href="#!">
                                    Home
                                </a>
                            </li>
                            <li>
                                <a class="header-top__link" href="#!">About</a>
                            </li>
                            <li>
                                <a class="header-top__link" href="#!">Blog</a>
                            </li>
                            <li>
                                <a class="header-top__link" href="#!">
                                    Contact
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <!-- Btn -->
                    <div class="header-top__btn">
                        <a href="#!" class="btn">Sign Up</a>
                    </div>
                </div>
                <!-- Hero -->
                <section class="hero">
                    <div class="hero__floating">
                        <div class="hero__floating-position">
                            <img src="./assets/icon/hero-1.svg" alt="" />
                            <img
                                class="position-flower"
                                src="./assets/icon/hero-2.svg"
                                alt=""
                            />
                        </div>
                    </div>
                    <div class="hero__floating-2">
                        <div class="hero__floating-position">
                            <img src="./assets/icon/hero-1.svg" alt="" />
                            <img
                                class="position-flower"
                                src="./assets/icon/hero-2.svg"
                                alt=""
                            />
                        </div>
                    </div>
                    <section class="hero__content">
                        <h1 class="hero__heading">
                            We’re a creative design agency.
                        </h1>
                        <p class="hero__desc">
                            A brilliant, modular agency template for startup’s
                            build yours toady.
                        </p>
                        <div class="hero__row">
                            <a href="#!" class="btn">Get in touch</a>
                            <div class="watch-video">
                                <img
                                    src="./assets/icon/ic-hero3.svg"
                                    alt=""
                                    class="watch-video__arc"
                                />
                                <div class="watch-video__btn">
                                    <img
                                        class="watch-video__icon"
                                        src="./assets/icon/play-ic.svg"
                                        alt=""
                                    />
                                </div>
                                <span class="hero__text">Watch Video</span>
                            </div>
                        </div>
                    </section>
                    <figure class="hero__media">
                        <img
                            class="hero__img"
                            src="./assets/image/hero-1.jpg"
                            alt="h1"
                        />
                        <img
                            class="hero__img"
                            src="./assets/image/hero-2.jpg"
                            alt="h2"
                        />
                        <img
                            class="hero__img"
                            src="./assets/image/hero-3.jpg"
                            alt="h3"
                        />
                    </figure>
                </section>
            </div>
        </header>
        <main>
            <!-- Partners -->
            <section class="partners">
                <div class="container">
                    <ul class="partners__list">
                        <li class="partners__item">

                                alt=""
                            />
                            <span class="partners__text partners__text--nw">
                                Agworld
                            </span>
                        </li>
                        <li class="partners__item">
                            <span class="partners__text partners__text--rio">
                                RioTinto
                            </span>
                        </li>
                        <li class="partners__item">
                            <img src="./assets/icon/p3.svg" alt="" />
                            <span
                                class="partners__text partners__text--spacing"
                            >
                                HEROKU
                            </span>
                        </li>
                    </ul>
                </div>
            </section>
